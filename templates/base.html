{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart RPA Builder{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'app.css' %}">
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'app.js' %}" defer></script>
</head>
<body>
  <header><a href="{% url 'home' %}">Smart RPA Builder</a><nav aria-label="Main navigation"><a href="{% url 'home' %}">Projects</a> · <a href="{% url 'robot-list' %}">Robots</a> · <a href="{% url 'muse-usage' %}">Muse usage</a></nav><span>Powered by Muse · Local workspace</span></header>
  <main>{% block content %}{% endblock %}</main>
  <script>document.addEventListener('htmx:responseError', function () { alert('The request failed. Please reload and try again.'); });</script>
</body>
</html>
